# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install chrome
        run: |
          sudo apt update && sudo apt install curl -y
          curl http://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_148.0.7778.167-1_amd64.deb \
            -o /tmp/google-chrome-stable_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive \
            apt install /tmp/google-chrome-stable_current_amd64.deb -y --allow-downgrades

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest
        run: npm test

      - name: Merge develop into main
        uses: everlytic/branch-merge@1.1.5
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}
          source_branch: 'develop'
          target_branch: 'main'